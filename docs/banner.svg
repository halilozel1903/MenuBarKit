<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="MenuBarKit: macOS menu bar apps in minutes with SwiftUI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1c1030"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="940" cy="260" r="290" fill="url(#glow)" filter="url(#blur)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="235" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-2">MenuBarKit</text>
    <text x="82" y="290" fill="#cbd5e1" font-size="28" font-weight="500">macOS menu bar apps in minutes</text>
    <g font-size="20" font-weight="600">
      <rect x="82" y="330" width="124" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="144" y="357" fill="#e2e8f0" text-anchor="middle">SwiftUI</text>
      <rect x="218" y="330" width="136" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="286" y="357" fill="#e2e8f0" text-anchor="middle">macOS 14+</text>
      <rect x="366" y="330" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="426" y="357" fill="#e2e8f0" text-anchor="middle">Swift 6</text>
    </g>
  </g>

  <!-- Menu bar -->
  <rect x="600" y="40" width="680" height="34" fill="#ffffff" fill-opacity="0.12"/>
  <g font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f5f9">
    <rect x="884" y="45" width="96" height="24" rx="6" fill="#ffffff" fill-opacity="0.22"/>
    <circle cx="902" cy="57" r="7" fill="none" stroke="#f1f5f9" stroke-width="2"/>
    <path d="M902 53 v4 l3 2" stroke="#f1f5f9" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="916" y="62">18:42</text>
    <path d="M1010 62 a12 12 0 0 1 20 0 M1014 65 a7 7 0 0 1 12 0" stroke="#f1f5f9" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="1050" y="51" width="24" height="12" rx="3" fill="none" stroke="#f1f5f9" stroke-width="1.6"/>
    <rect x="1053" y="54" width="15" height="6" rx="1" fill="#f1f5f9"/>
    <text x="1096" y="62">Thu 9:41</text>
  </g>

  <!-- Panel -->
  <g filter="url(#shadow)">
    <rect x="740" y="84" width="380" height="402" rx="16" fill="#1e2130" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif">
    <!-- Header -->
    <rect x="760" y="104" width="44" height="44" rx="12" fill="url(#orange)"/>
    <circle cx="782" cy="127" r="11" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M782 121 v6 l4 3" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="818" y="122" fill="#ffffff" font-size="17" font-weight="700">Tempo</text>
    <text x="818" y="142" fill="#94a3b8" font-size="13">Paused · 18:42 left</text>
    <rect x="1066" y="114" width="34" height="22" rx="11" fill="#f97316" fill-opacity="0.22"/>
    <text x="1083" y="130" fill="#fb923c" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <rect x="756" y="162" width="348" height="1" fill="#ffffff" fill-opacity="0.12"/>

    <!-- Timer section -->
    <text x="766" y="186" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">TIMER</text>
    <rect x="756" y="194" width="348" height="38" rx="8" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="766" y="201" width="24" height="24" rx="7" fill="url(#orange)"/>
    <path d="M775 207 l9 6 l-9 6 Z" fill="#fff"/>
    <text x="800" y="211" fill="#f8fafc" font-size="14">Resume</text>
    <text x="800" y="226" fill="#94a3b8" font-size="11">⌥⌘T</text>
    <text x="1092" y="218" fill="#94a3b8" font-size="14" text-anchor="end">18:42</text>

    <rect x="766" y="241" width="24" height="24" rx="7" fill="url(#teal)"/>
    <rect x="772" y="249" width="10" height="9" rx="2" fill="#fff"/>
    <text x="800" y="258" fill="#f8fafc" font-size="14">Short Break</text>
    <text x="1092" y="258" fill="#94a3b8" font-size="14" text-anchor="end">5 min</text>

    <rect x="766" y="277" width="24" height="24" rx="7" fill="url(#green)"/>
    <circle cx="778" cy="285" r="2.5" fill="#fff"/>
    <path d="M778 288 l-2 7 M778 288 l3 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="800" y="294" fill="#f8fafc" font-size="14">Long Break</text>
    <text x="1092" y="294" fill="#94a3b8" font-size="14" text-anchor="end">15 min</text>

    <!-- Options section -->
    <text x="766" y="334" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">OPTIONS</text>
    <rect x="766" y="344" width="24" height="24" rx="7" fill="url(#indigo)"/>
    <path d="M782 350 a7 7 0 1 0 2 10 a6 6 0 0 1 -2 -10 Z" fill="#fff"/>
    <text x="800" y="361" fill="#f8fafc" font-size="14">Do Not Disturb</text>
    <rect x="1054" y="346" width="38" height="22" rx="11" fill="#22c55e"/>
    <circle cx="1081" cy="357" r="9" fill="#fff"/>

    <rect x="766" y="380" width="24" height="24" rx="7" fill="url(#pink)"/>
    <path d="M772 389 h4 l5 -4 v14 l-5 -4 h-4 Z" fill="#fff"/>
    <text x="800" y="397" fill="#f8fafc" font-size="14">Play Sound</text>
    <rect x="1054" y="382" width="38" height="22" rx="11" fill="#22c55e"/>
    <circle cx="1081" cy="393" r="9" fill="#fff"/>

    <!-- Footer -->
    <rect x="756" y="424" width="348" height="1" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="766" y="440" width="96" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="814" y="459" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">Settings…</text>
    <text x="930" y="459" fill="#64748b" font-size="12" text-anchor="middle">v1.2</text>
    <rect x="1018" y="440" width="76" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="1056" y="459" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">Quit</text>
  </g>
</svg>
